# The msg-command-blocker module prevents players from sending private messages
# (/msg, /tell, /w, etc.) and global messages (/me) while they are in a game. This helps maintain fair play
# and prevents players from sharing information that could affect the outcome.
msg-command-blocker:
  # Master switch to enable or disable blocking of private message commands (/msg, /tell, /w, /me, etc.).
  disabled: false

  # Legacy mode for command blocking:
  # - false: Attempts to automatically intercept private message commands, even when executed via /execute.
  # - true: Uses the explicit "commands" list below to determine which commands to block.
  #   Recommended if other plugins override /msg or if console errors suggest enabling legacy mode.
  legacy: false

  # List of commands to block when legacy mode is enabled.
  # These commands will be prevented while a player is in a game.
  commands:
    - msg
    - tell
    - w
    - me
    - minecraft:tell
    - minecraft:msg
    - minecraft:w
    - minecraft:me

# MorphBlender / Skin Animation Configuration
# This section allows you to enable or disable the MorphBlender
# and choose which animation to use for morphing skins.
# A valid Mineskin API key is required for this feature.
# See secrets.properties for more information.
morph-blender:
  # Master switch to enable/disable MorphBlender
  # If this is off, a player changing form will simply acquire the chosen skin.
  enabled: false

  # Blender to use
  # Available blenders:
  # - virus: Virus blending
  # - fade: Fade blending
  # - checker: Checkerboard blending
  # default: virus
  blender: virus

  # Sets the visibility of the skins on https://mineskin.org/skins
  # Available visibilities:
  # - public: Anyone can see the skin (not recommended)
  # - unlisted: It won't be shown in the skin list, but everyone with the link can access it
  # - private: Only you can see and access the skin
  # - auto: if your MineSkin Plan allows private skins, it will be private, otherwise it will be unlisted
  # default: auto
  visibility: auto

roles:
  # List of roles that will be disabled and hidden in the game.
  # Any role listed here will not be accessible in the game.
  disabled:
  #  - phantom

modifications:
  # List of modifications that will be disabled and hidden in the game.
  # Any modification listed here will not be accessible in the game.
  disabled:
  #  - small

game-creation:
  # Should non-admins (players without permission: 'amongus.admin.game.create') be able to create games?
  everyone-can-create: false
  # Maximum number of games that can exist simultaneously.
  max-games: 10
  # Should admins (players with permission: 'amongus.admin.game.create') be able to ignore that max-games limit?
  ignore-admins: true

# ActionLog upload configuration
action-log-upload:
  # Should we upload ActionLogs to a server?
  enabled: true

  # The URL to upload the ActionLogs to.
  url: https://logs.among-us-in-minecraft.fantamomo.com

  # Should we send ActionLogs to all player that where in the game? (true)
  # Or only to the host? (false)
  send-to-players: true

  # Time to live for uploaded ActionLogs, after which they will be deleted from the server.
  # A value over the server maximal time to live will be truncated to that value.
  # The default value of logs.among-us-in-minecraft.fantamomo.com is 48 hours.
  # Avoidable formats: s (seconds), m (minutes), h (hours), d (days)
  # Examples: 1h, 2d, 30m, 48s
  # They can be a combination of these formats, e.g. 1h30m
  # Set to 0 to use the default value of the server.
  ttl: 48h

ai:
  enabled: false
  provider:
    # Currently only OpenRouter is supported
    type: openrouter
    base-url:
    chat-completions-path:
    model-path:
    embeddings-path:
  # You can specify more then one model here, separated by ";", e.g. "google/gemini-2.5-flash;google/gemini-2.5-pro"
  # The first model is used as the default model.
  # If the model fails, the next model is used, and so on.
  # The only use case for this is if you use a provider like OpenRouter and some models are down.
  model: google/gemini-2.5-flash

  generate-game-summary: true
  latency-warning: true

bots:
  # Should bots be enabled?
  enabled: true
  # Should only admins be able to create bots?
  only-admins: false
  # Should admins be able to ignore the bots limit?
  admin-ignore-bots-limit: true
  # Maximum number of bots that can be created per game.
  # Set to 0 to disable the limit. (There are only 9 bots in the game, so 0 or any number above 9 is the same as 9)
  max-bots-per-game: 5

# Should we animate the scoreboard?
animate-scoreboard: true